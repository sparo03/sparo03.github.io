<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Complete signup — Dionysus Magazine</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="page-subscribe">
  <div class="shell">
    <header class="top site-header site-header-simple"><a aria-label="Dionysus Magazine home" class="brand" href="./index.html"><div class="masthead">DIONYSUS</div><small>Magazine</small></a></header>
    <nav aria-label="Back navigation" class="nav-back"><a class="back" href="./index.html">← Back to magazine</a></nav>
    <main class="layout">
      <section class="intro"><div class="eyebrow">Dionysus Magazine</div><h1>Almost<br>there.</h1><p>Your payment is complete. Choose a password to finish creating your magazine account.</p></section>
      <section class="form-panel">
        <h2>Complete your account</h2>
        <p class="hint" id="emailHint">Your email and shipping address will be imported securely from Stripe.</p>
        <form id="finishForm">
          <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div>
          <div class="field"><label for="repeat">Repeat password</label><input id="repeat" type="password" autocomplete="new-password" minlength="8" required></div>
          <button class="btn" id="finishButton" type="submit">Create my account</button>
        </form>
        <p id="message" class="message hidden" role="status" aria-live="polite"></p>
      </section>
    </main>
    <footer class="site-footer">© <span id="site-copyright-year"></span> DIONYSUS Magazine</footer>
  </div>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const SUPABASE_URL = 'https://imwqgvigesticlhsakfx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_GEjJpD7saLKkIDj7LmeCiQ_CbvduMlo';
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const sessionId = params.get('session_id');
    // Keep Checkout Session IDs out of browser history, referrers and analytics URLs.
    history.replaceState(null, '', location.pathname);
    $('site-copyright-year').textContent = new Date().getFullYear();
    function message(value, error = false) {
      $('message').textContent = value;
      $('message').className = 'message' + (error ? ' error' : '');
      $('message').classList.toggle('hidden', !value);
    }
    if (!sessionId || !sessionId.startsWith('cs_')) {
      $('finishButton').disabled = true;
      message('Missing Stripe Checkout Session. Please return here using the link shown after payment.', true);
    }
    $('finishForm').addEventListener('submit', async event => {
      event.preventDefault();
      const password = $('password').value;
      if (password !== $('repeat').value) return message('Passwords do not match.', true);
      if (password.length < 8) return message('Use at least 8 characters.', true);
      $('finishButton').disabled = true;
      message('Verifying your payment and creating your account…');
      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/complete-signup-sandbox`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
          body: JSON.stringify({ session_id: sessionId, password })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to complete signup.');
        // Sign in with the Stripe email returned by the trusted Edge Function.
        const { error } = await db.auth.signInWithPassword({ email: result.email, password });
        if (error) {
          message('Account created. Please sign in using your Stripe email and password.');
          window.setTimeout(() => location.assign('./Subscribe.html#login'), 2500);
          return;
        }
        location.replace('./profile.html');
      } catch (error) {
        message(error.message || 'Something went wrong. Please contact support.', true);
        $('finishButton').disabled = false;
      }
    });
  </script>
</body>
</html>
