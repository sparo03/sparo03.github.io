<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Create account — Dionysus Magazine</title><link href="./style.css" rel="stylesheet"/></head>
<body class="page-subscribe"><div class="shell"><header class="top site-header site-header-simple"><a class="brand" href="./index.html"><div class="masthead">DIONYSUS</div><small>Magazine</small></a></header><nav aria-label="Back navigation" class="nav-back"><a class="back" href="./index.html">Back to magazine</a></nav><main class="layout"><section class="form-panel"><div id="signupStage"><h2>Create an account</h2><form id="signupForm"><div class="field"><label for="email">Email address</label><input autocomplete="email" id="email" required="" type="email"/></div><div class="field"><label for="password">Password</label><input autocomplete="new-password" id="password" minlength="8" required="" type="password"/></div><div class="field"><label for="repeat">Repeat password</label><input autocomplete="new-password" id="repeat" minlength="8" required="" type="password"/></div><button class="btn" id="signupButton">Create free account</button></form><a class="auth-switch" href="#login" id="showLogin">Log in</a></div><div class="hidden" id="loginStage"><h2>Log in</h2><form id="loginForm"><div class="field"><label for="loginEmail">Email address</label><input autocomplete="username" id="loginEmail" required="" type="email"/></div><div class="field"><label for="loginPassword">Password</label><input autocomplete="current-password" id="loginPassword" required="" type="password"/></div><button class="btn" id="loginButton">Log in</button></form><a class="auth-switch" href="#signup" id="showSignup">Create an account</a></div><div aria-live="polite" class="message hidden" id="message" role="status"></div></section></main><footer class="site-footer">© <span id="year"></span> DIONYSUS Magazine</footer></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://imwqgvigesticlhsakfx.supabase.co','sb_publishable_GEjJpD7saLKkIDj7LmeCiQ_CbvduMlo');
const $=id=>document.getElementById(id);
function message(s){$('message').textContent=s;$('message').classList.toggle('hidden',!s)}
function stage(login){$('signupStage').classList.toggle('hidden',login);$('loginStage').classList.toggle('hidden',!login);message('')}
$('showLogin').onclick=e=>{e.preventDefault();location.hash='login';stage(true)};
$('showSignup').onclick=e=>{e.preventDefault();location.hash='signup';stage(false)};
stage(location.hash!=='#signup');$('year').textContent=new Date().getFullYear();
$('signupForm').onsubmit=async e=>{e.preventDefault();if($('password').value!==$('repeat').value){message('Passwords do not match.');return}
 const button=$('signupButton');button.disabled=true;try{
 const {data,error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});if(error)throw error;
 if(data.session){location.replace('./profile.html');return}
 message('Account registration received. Check your email to confirm your address, then log in.');
 }catch(err){message(err.message)}finally{button.disabled=false}};
$('loginForm').onsubmit=async e=>{e.preventDefault();const button=$('loginButton');button.disabled=true;try{
 const {error}=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error)throw error;location.replace('./profile.html');
 }catch(err){message(err.message)}finally{button.disabled=false}};
</script></body></html>
