<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Profile — Dionysus Magazine</title><link href="./style.css" rel="stylesheet"/></head><body class="page-profile"><div class="shell"><header class="top site-header site-header-simple"><a aria-label="Dionysus Magazine home" class="brand" href="./index.html"><div class="masthead">DIONYSUS</div><small>Magazine</small></a></header>
<nav aria-label="Back navigation" class="nav-back"><a class="back" href="./index.html">← Back to magazine</a></nav><main class="layout"><section aria-label="Membership overview"><h2 class="member-title">Membership</h2><p class="member-email" id="status">Loading account…</p><div class="member-details"><div><span class="member-detail-label">Member since</span><span class="member-detail-value" id="memberSince">—</span></div><div><span class="member-detail-label">Membership status</span><span class="member-detail-value" id="memberStatus">—</span></div></div><button class="btn secondary hidden" id="signout">Sign out</button></section><div class="hidden" id="content"><section class="panel"><h2>Account details</h2><form id="accountForm"><div class="field"><label for="email">Email address</label><input autocomplete="email" id="email" required="" type="email"/></div><div class="field"><label for="password">New password (leave blank to keep current)</label><input autocomplete="new-password" id="password" minlength="8" type="password"/></div><div class="field"><label for="repeat">Repeat new password</label><input autocomplete="new-password" id="repeat" minlength="8" type="password"/></div><button class="btn" type="submit">Save account details</button></form></section><section class="panel" id="shippingPanel"><h2>Shipping address</h2><form id="shippingForm"><div class="grid"><div class="field"><label for="first">First name</label><input id="first" maxlength="100" required=""/></div><div class="field"><label for="last">Last name</label><input id="last" maxlength="100" required=""/></div></div><div class="field"><label for="address">Street address</label><input id="address" maxlength="250" required=""/></div><div class="grid"><div class="field"><label for="postal">Postal code</label><input id="postal" maxlength="30" required=""/></div><div class="field"><label for="city">City</label><input id="city" maxlength="120" required=""/></div></div><div class="field"><label for="country">Country</label><input id="country" maxlength="100" required=""/></div><button class="btn" type="submit">Save shipping address</button></form></section><section class="panel"><h2>Subscription</h2><div class="actions"><button class="btn danger" id="cancel" type="button">Cancel subscription</button><button class="btn hidden" id="reactivate" type="button">Subscribe</button></div></section></div></main><footer class="site-footer">© <span id="site-copyright-year"></span> DIONYSUS Magazine</footer></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://imwqgvigesticlhsakfx.supabase.co','sb_publishable_GEjJpD7saLKkIDj7LmeCiQ_CbvduMlo');
const $=id=>document.getElementById(id);let user=null,record=null;
function msg(text,error=false){if(error)alert(text);}
function renderStatus(){const active=record?.subscription_status==='active';$('memberStatus').textContent=!record?'No subscription':active?'Active':'Cancelled';$('cancel').classList.toggle('hidden',!active);$('reactivate').classList.toggle('hidden',!record||active)}
async function refresh(){const {data,error}=await db.from('magazine_subscribers').select('user_id,email,first_name,last_name,street_address,postal_code,city,country,subscription_status').eq('user_id',user.id).maybeSingle();if(error)throw error;record=data;for(const [id,key] of Object.entries({first:'first_name',last:'last_name',address:'street_address',postal:'postal_code',city:'city',country:'country'}))$(id).value=record?.[key]||'';renderStatus()}
async function init(){const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session){location.replace('./Subscribe.html#login');return}user=session.user;const joined=user.created_at?new Date(user.created_at):null;$('memberSince').textContent=joined&&!Number.isNaN(joined.getTime())?new Intl.DateTimeFormat('en',{day:'numeric',month:'long',year:'numeric'}).format(joined):'Unavailable';$('email').value=user.email||'';$('status').textContent=user.email||'Signed in';$('signout').classList.remove('hidden');$('content').classList.remove('hidden');await refresh()}
$('accountForm').addEventListener('submit',async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;if(password!==$('repeat').value){msg('New passwords do not match.',true);return}if(password&&password.length<8){msg('Password must be at least 8 characters.',true);return}const changes={};if(email!==user.email)changes.email=email;if(password)changes.password=password;if(!Object.keys(changes).length){msg('No account changes to save.');return}const button=e.submitter;button.disabled=true;try{const {error}=await db.auth.updateUser(changes);if(error)throw error;$('password').value='';$('repeat').value='';msg(changes.email?'Account updated. An email change may require confirmation before it takes effect.':'Password updated.');}catch(err){msg(err.message,true)}finally{button.disabled=false}});
$('shippingForm').addEventListener('submit',async e=>{e.preventDefault();if(!record){msg('No subscription record found. Please register through Subscribe first.',true);return}const button=e.submitter;button.disabled=true;const payload={first_name:$('first').value.trim(),last_name:$('last').value.trim(),street_address:$('address').value.trim(),postal_code:$('postal').value.trim(),city:$('city').value.trim(),country:$('country').value.trim()};try{const {error}=await db.from('magazine_subscribers').update(payload).eq('user_id',user.id);if(error)throw error;await refresh();msg('Shipping address saved.')}catch(err){msg(err.message,true)}finally{button.disabled=false}});
$('cancel').addEventListener('click',async()=>{
  if(!confirm('Are you sure you want to unsubscribe? This will permanently delete your account and shipping information. This cannot be undone.'))return;
  const button=$('cancel');button.disabled=true;
  try{
    const {error}=await db.rpc('cancel_dionysus_account');
    if(error)throw error;
    try{await db.auth.signOut({scope:'local'})}catch(_e){}
    location.replace('./index.html');
  }catch(err){msg(err.message||'Unable to delete your account.',true);button.disabled=false}
});
$('reactivate').addEventListener('click',async()=>{$('reactivate').disabled=true;try{const {error}=await db.from('magazine_subscribers').update({subscription_status:'active'}).eq('user_id',user.id);if(error)throw error;await refresh();msg('')}catch(err){msg(err.message,true)}finally{$('reactivate').disabled=false}});
$('signout').addEventListener('click',async()=>{const {error}=await db.auth.signOut();if(error){msg(error.message,true);return}location.replace('./index.html')});
init().catch(err=>{$('status').textContent='Unable to load profile';msg(err.message||String(err),true);$('content').classList.remove('hidden')});
</script><script>document.getElementById("site-copyright-year").textContent = new Date().getFullYear();</script></body></html>
