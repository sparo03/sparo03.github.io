<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Profile — Dionysus Magazine</title><link href="./style.css" rel="stylesheet"/></head><body class="page-profile"><div class="shell"><header class="top site-header site-header-simple"><a aria-label="Dionysus Magazine home" class="brand" href="./index.html"><div class="masthead">DIONYSUS</div><small>Magazine</small></a></header><nav aria-label="Back navigation" class="nav-back"><a class="back" href="./index.html">Back to magazine</a></nav>
<main class="layout"><section aria-label="Membership overview" class="panel" id="membershipOverview"><h2 class="member-title">Membership</h2><div class="member-details"><div><span class="member-detail-label">Membership status</span><span class="member-detail-value" id="memberStatus">—</span></div></div><div class="actions"><button class="btn hidden" id="subscribeTop" type="button">Subscribe</button><button class="btn hidden" id="resume" type="button">Subscribe</button><button class="btn danger" id="cancel" type="button">Cancel subscription</button></div></section><section aria-label="Account overview" class="panel" id="accountOverview"><h2>Account</h2><div class="member-details"><div><span class="member-detail-label">Email address</span><span class="member-detail-value" id="status">—</span></div><div class="member-shipping"><span class="member-detail-label">Shipping address</span><div class="member-detail-value" id="shippingAddressDisplay">—</div></div></div><button class="btn secondary hidden" id="signout">Sign out</button></section><div class="hidden" id="content"><section class="panel"><h2>Password</h2><form id="accountForm"><div class="field"><label for="password">New password</label><input autocomplete="new-password" id="password" minlength="8" type="password"/></div><div class="field"><label for="repeat">Repeat new password</label><input autocomplete="new-password" id="repeat" minlength="8" type="password"/></div><button class="btn" type="submit">Save password</button></form></section><section class="panel" id="shippingPanel"><h2>Shipping address</h2><form id="shippingForm"><div class="grid"><div class="field"><label for="first">First name</label><input id="first" maxlength="100" required=""/></div><div class="field"><label for="last">Last name</label><input id="last" maxlength="100" required=""/></div></div><div class="field"><label for="address">Street address</label><input id="address" maxlength="250" required=""/></div><div class="grid"><div class="field"><label for="postal">Postal code</label><input id="postal" maxlength="30" required=""/></div><div class="field"><label for="city">City</label><input id="city" maxlength="120" required=""/></div></div><div class="field"><label for="country">Country</label><input id="country" maxlength="100" required=""/></div><button class="btn" type="submit">Save shipping address</button></form></section></div></main><footer class="site-footer">© <span id="site-copyright-year"></span> DIONYSUS Magazine</footer></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://imwqgvigesticlhsakfx.supabase.co','sb_publishable_GEjJpD7saLKkIDj7LmeCiQ_CbvduMlo');
const $=id=>document.getElementById(id);let user=null,record=null;
function msg(text,error=false){if(error)alert(text);}
function renderStatus(){
 const active=record?.subscription_status==='active';
 const ending=active && record?.cancel_at_period_end===true;
 const endDate=record?.current_period_end ? new Date(record.current_period_end) : null;
 const formatted=endDate && !Number.isNaN(endDate.getTime()) ? new Intl.DateTimeFormat('en',{day:'numeric',month:'long',year:'numeric'}).format(endDate) : null;
 $('memberStatus').textContent=ending ? ('Active until '+(formatted||'end of paid period')) : active ? 'Active' : 'Inactive';
 $('cancel').classList.toggle('hidden',!active||ending);
 $('resume').classList.toggle('hidden',!ending);
 $('subscribeTop').classList.toggle('hidden',active);
}
async function refresh(){
 const {data,error}=await db.from('magazine_subscribers').select('user_id,email,first_name,last_name,street_address,postal_code,city,country,subscription_status,cancel_at_period_end,current_period_end').eq('user_id',user.id).maybeSingle();
 if(error)throw error;
 record=data;
 for(const [id,key] of Object.entries({first:'first_name',last:'last_name',address:'street_address',postal:'postal_code',city:'city',country:'country'}))$(id).value=record?.[key]||'';
 const addressParts=[
  [record?.first_name,record?.last_name].filter(Boolean).join(' '),
  record?.street_address,
  [record?.postal_code,record?.city].filter(Boolean).join(' '),
  record?.country
 ].filter(Boolean);
 $('shippingAddressDisplay').textContent=addressParts.length ? addressParts.join('\n') : 'No shipping address saved yet';
 renderStatus();
}
const LOGIN_URL = './Subscribe.html#login';
let redirecting = false;
async function logoutAndRedirect() {
 if (redirecting) return;
 redirecting = true;
 $('content').classList.add('hidden');
 try { await db.auth.signOut({ scope: 'local' }); } catch (_) {}
 location.replace(LOGIN_URL);
}
async function authenticatedSession() {
 const {data:{session},error} = await db.auth.getSession();
 if (error || !session) { await logoutAndRedirect(); return null; }
 const {data:{user:verifiedUser},error:userError} = await db.auth.getUser();
 if (userError || !verifiedUser) { await logoutAndRedirect(); return null; }
 return { ...session, user: verifiedUser };
}
db.auth.onAuthStateChange((event) => {
 if (event === 'SIGNED_OUT' && !redirecting) {
  redirecting = true;
  $('content').classList.add('hidden');
  location.replace(LOGIN_URL);
 }
});
async function init(){
 const session = await authenticatedSession();
 if (!session) return;
 user=session.user;
 $('status').textContent=user.email||'Signed in';
 await refresh();
 if (redirecting) return;
 $('signout').classList.remove('hidden');
 $('content').classList.remove('hidden');
}
$('accountForm').addEventListener('submit',async e=>{e.preventDefault();const password=$('password').value;if(!password){msg('Enter a new password to save.');return}if(password!==$('repeat').value){msg('New passwords do not match.',true);return}if(password.length<8){msg('Password must be at least 8 characters.',true);return}const button=e.submitter;button.disabled=true;try{const {error}=await db.auth.updateUser({password});if(error)throw error;$('password').value='';$('repeat').value='';msg('Password updated.')}catch(err){msg(err.message,true)}finally{button.disabled=false}});
$('shippingForm').addEventListener('submit',async e=>{e.preventDefault();if(!record){msg('Subscription details are not available yet.',true);return}const button=e.submitter;button.disabled=true;const payload={first_name:$('first').value.trim(),last_name:$('last').value.trim(),street_address:$('address').value.trim(),postal_code:$('postal').value.trim(),city:$('city').value.trim(),country:$('country').value.trim()};try{const {error}=await db.from('magazine_subscribers').update(payload).eq('user_id',user.id);if(error)throw error;await refresh();msg('Shipping address saved.')}catch(err){msg(err.message,true)}finally{button.disabled=false}});
async function invokeSecure(name, action){
 const session = await authenticatedSession();
 if (!session) return null;
 let response;
 try {
  response=await fetch('https://imwqgvigesticlhsakfx.supabase.co/functions/v1/'+name,{
   method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_GEjJpD7saLKkIDj7LmeCiQ_CbvduMlo'},body:JSON.stringify({action})
  });
 } catch (err) { throw new Error('Unable to contact the subscription service. Check your connection.'); }
 const result=await response.json().catch(()=>({error:'Edge Function returned a non-JSON response'}));
 if (response.status===401 || (response.status===403 && /invalid session|invalid jwt|expired token|unauthorized/i.test(result.error||''))) {
  await logoutAndRedirect();
  return null;
 }
 if (!response.ok) throw new Error(result.error||'Request failed');
 return result;
}
$('subscribeTop').addEventListener('click',async()=>{
 const button=$('subscribeTop');button.disabled=true;
 try{const result=await invokeSecure('stripe-webhook','create_checkout');if(result?.url) location.assign(result.url)}
 catch(err){msg(err.message,true);button.disabled=false}
});
$('cancel').addEventListener('click',async()=>{
 if(!confirm('Cancel your Stripe subscription? Your account and shipping information will be kept.'))return;
 const button=$('cancel');button.disabled=true;
 try{const result=await invokeSecure('stripe-webhook','cancel_subscription');if(!result) return;record={...record,cancel_at_period_end:true,current_period_end:result.current_period_end};renderStatus();await refresh();}
 catch(err){msg(err.message,true)}finally{button.disabled=false}
});
$('resume').addEventListener('click',async()=>{
 const button=$('resume');button.disabled=true;
 try{await invokeSecure('stripe-webhook','resume_subscription');if(redirecting) return;record={...record,cancel_at_period_end:false};renderStatus();await refresh();}
 catch(err){msg(err.message,true)}finally{button.disabled=false}
});
$('signout').addEventListener('click', logoutAndRedirect);
init().catch(async err=>{
 if (/invalid session|jwt|auth session missing|refresh token|not authenticated/i.test(err.message||'')) {
  await logoutAndRedirect();
  return;
 }
 $('status').textContent='Unable to load profile';
 console.error(err);
 msg(err.message||String(err),true);
});
</script><script>document.getElementById("site-copyright-year").textContent = new Date().getFullYear();</script></body></html>
