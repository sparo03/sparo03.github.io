<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — Dionysus Magazine</title><style>
:root{--ink:#14243a;--muted:#647184;--line:#dbe0e5}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff;font-family:Arial,Helvetica,sans-serif}a{color:inherit}.shell{max-width:1050px;margin:auto;padding:26px clamp(20px,5vw,75px) 80px}.top{display:flex;justify-content:center;align-items:center;border-bottom:1px solid var(--line);padding-bottom:24px}.nav-back{padding-top:20px}.nav-back .back{display:inline-block}.brand{text-decoration:none;text-align:center}.masthead{font-family:Georgia,serif;font-size:clamp(38px,5.5vw,67px);letter-spacing:-.068em;line-height:.9}.brand small{display:block;font-family:Georgia,serif;font-size:15px;letter-spacing:.18em;margin-top:11px}.back{font-size:12px;letter-spacing:.1em;text-decoration:none;text-transform:uppercase}.layout{display:grid;grid-template-columns:.7fr 1.3fr;gap:clamp(30px,6vw,85px);padding:70px 0}.eyebrow{font-size:12px;font-weight:bold;letter-spacing:.16em;text-transform:uppercase}h1{font:normal clamp(42px,6vw,74px)/1.03 Georgia,serif;letter-spacing:-.055em;margin:18px 0}h2{font:normal 29px Georgia,serif;margin:0 0 20px}p{line-height:1.55;color:var(--muted)}.panel{border:1px solid var(--line);padding:clamp(20px,3vw,35px);margin-bottom:20px}.field{margin-bottom:17px}label{display:block;font-size:12px;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}input{width:100%;padding:13px 12px;border:1px solid #b9c1ca;border-radius:0;font:16px Arial,sans-serif;min-height:46px;color:var(--ink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{background:var(--ink);color:white;border:1px solid var(--ink);padding:14px 21px;font:12px Arial,sans-serif;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;min-height:46px}.btn.secondary{background:white;color:var(--ink)}.btn.danger{background:white;color:#9b2633;border-color:#9b2633}.btn:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap}.message{padding:12px;border:1px solid var(--line);margin:14px 0;white-space:pre-wrap;font-size:14px}.message.error{color:#9b2633}.hidden{display:none!important}footer{border-top:1px solid var(--line);padding-top:22px;color:var(--muted);font-size:12px}@media(max-width:740px){.layout{grid-template-columns:1fr;padding:40px 0}.grid{grid-template-columns:1fr}}

/* Member card and account forms */
.layout{display:flex;flex-direction:column;gap:26px;padding:42px 0 60px;max-width:720px;margin:0 auto;}
.layout>section:first-child{border:1px solid var(--line);padding:clamp(22px,4vw,36px);text-align:center;}
.layout>section:first-child .member-title{margin:0 0 20px;}
.layout>section:first-child #status{overflow-wrap:anywhere;}
.layout>section:first-child #signout{max-width:100%;}
.member-title{font:normal 29px Georgia,serif;margin:0 0 20px;text-align:left}.member-kicker{font-size:11px;font-weight:bold;letter-spacing:.19em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}.member-details{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0 24px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left}.member-detail-label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:bold;color:var(--ink);margin-bottom:8px}.member-detail-value{display:block;font-size:14px;font-weight:bold;overflow-wrap:anywhere}.member-email{font-size:15px;color:var(--ink);margin:12px 0 0;text-align:left;width:100%;align-self:stretch;}@media(max-width:480px){.member-details{grid-template-columns:1fr}}
.layout>#content{width:100%;}
/* Full-width form and account action buttons */
button.btn{display:block;width:100%;max-width:none;}
.actions{display:flex;flex-direction:column;align-items:stretch;}
.actions button.btn{width:100%;}
</style></head><body><div class="shell"><header class="top"><a class="brand" href="./index.html"><div class="masthead">DIONYSUS</div><small>Magazine</small></a></header><nav class="nav-back" aria-label="Back navigation"><a class="back" href="./index.html">← Back to magazine</a></nav><main class="layout"><section aria-label="Membership overview"><h2 class="member-title">Membership</h2><p class="member-email" id="status">Loading account…</p><div class="member-details"><div><span class="member-detail-label">Member since</span><span class="member-detail-value" id="memberSince">—</span></div><div><span class="member-detail-label">Membership status</span><span class="member-detail-value" id="memberStatus">—</span></div></div><button class="btn secondary hidden" id="signout">Sign out</button></section><div id="content" class="hidden"><section class="panel"><h2>Account details</h2><form id="accountForm"><div class="field"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">New password (leave blank to keep current)</label><input id="password" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label for="repeat">Repeat new password</label><input id="repeat" type="password" minlength="8" autocomplete="new-password"></div><button class="btn" type="submit">Save account details</button></form></section><section class="panel" id="shippingPanel"><h2>Shipping address</h2><form id="shippingForm"><div class="grid"><div class="field"><label for="first">First name</label><input id="first" required maxlength="100"></div><div class="field"><label for="last">Last name</label><input id="last" required maxlength="100"></div></div><div class="field"><label for="address">Street address</label><input id="address" required maxlength="250"></div><div class="grid"><div class="field"><label for="postal">Postal code</label><input id="postal" required maxlength="30"></div><div class="field"><label for="city">City</label><input id="city" required maxlength="120"></div></div><div class="field"><label for="country">Country</label><input id="country" required maxlength="100"></div><button class="btn" type="submit">Save shipping address</button></form></section><section class="panel"><h2>Subscription</h2><div class="actions"><button class="btn danger" id="cancel" type="button">Cancel subscription</button><button class="btn hidden" id="reactivate" type="button">Subscribe</button></div></section></div></main><footer>© <span id="year"></span> DIONYSUS Magazine</footer></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://imwqgvigesticlhsakfx.supabase.co','sb_publishable_GEjJpD7saLKkIDj7LmeCiQ_CbvduMlo');
const $=id=>document.getElementById(id);$('year').textContent=new Date().getFullYear();let user=null,record=null;
function msg(text,error=false){if(error)alert(text);}
function renderStatus(){const active=record?.subscription_status==='active';$('memberStatus').textContent=!record?'No subscription':active?'Active':'Cancelled';$('cancel').classList.toggle('hidden',!active);$('reactivate').classList.toggle('hidden',!record||active)}
async function refresh(){const {data,error}=await db.from('magazine_subscribers').select('user_id,email,first_name,last_name,street_address,postal_code,city,country,subscription_status').eq('user_id',user.id).maybeSingle();if(error)throw error;record=data;for(const [id,key] of Object.entries({first:'first_name',last:'last_name',address:'street_address',postal:'postal_code',city:'city',country:'country'}))$(id).value=record?.[key]||'';renderStatus()}
async function init(){const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session){location.replace('./Subscribe.html#login');return}user=session.user;const joined=user.created_at?new Date(user.created_at):null;$('memberSince').textContent=joined&&!Number.isNaN(joined.getTime())?new Intl.DateTimeFormat('en',{day:'numeric',month:'long',year:'numeric'}).format(joined):'Unavailable';$('email').value=user.email||'';$('status').textContent=user.email||'Signed in';$('signout').classList.remove('hidden');$('content').classList.remove('hidden');await refresh()}
$('accountForm').addEventListener('submit',async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;if(password!==$('repeat').value){msg('New passwords do not match.',true);return}if(password&&password.length<8){msg('Password must be at least 8 characters.',true);return}const changes={};if(email!==user.email)changes.email=email;if(password)changes.password=password;if(!Object.keys(changes).length){msg('No account changes to save.');return}const button=e.submitter;button.disabled=true;try{const {error}=await db.auth.updateUser(changes);if(error)throw error;$('password').value='';$('repeat').value='';msg(changes.email?'Account updated. An email change may require confirmation before it takes effect.':'Password updated.');}catch(err){msg(err.message,true)}finally{button.disabled=false}});
$('shippingForm').addEventListener('submit',async e=>{e.preventDefault();if(!record){msg('No subscription record found. Please register through Subscribe first.',true);return}const button=e.submitter;button.disabled=true;const payload={first_name:$('first').value.trim(),last_name:$('last').value.trim(),street_address:$('address').value.trim(),postal_code:$('postal').value.trim(),city:$('city').value.trim(),country:$('country').value.trim()};try{const {error}=await db.from('magazine_subscribers').update(payload).eq('user_id',user.id);if(error)throw error;await refresh();msg('Shipping address saved.')}catch(err){msg(err.message,true)}finally{button.disabled=false}});
$('cancel').addEventListener('click',async()=>{
  if(!confirm('Are you sure you want to unsubscribe? This will permanently delete your account and shipping information. This cannot be undone.'))return;
  const button=$('cancel');button.disabled=true;
  try{
    const {error}=await db.rpc('cancel_dionysus_account');
    if(error)throw error;
    try{await db.auth.signOut({scope:'local'})}catch(_e){}
    location.replace('./index.html');
  }catch(err){msg(err.message||'Unable to delete your account.',true);button.disabled=false}
});
$('reactivate').addEventListener('click',async()=>{$('reactivate').disabled=true;try{const {error}=await db.from('magazine_subscribers').update({subscription_status:'active'}).eq('user_id',user.id);if(error)throw error;await refresh();msg('')}catch(err){msg(err.message,true)}finally{$('reactivate').disabled=false}});
$('signout').addEventListener('click',async()=>{const {error}=await db.auth.signOut();if(error){msg(error.message,true);return}location.replace('./index.html')});
init().catch(err=>{$('status').textContent='Unable to load profile';msg(err.message||String(err),true);$('content').classList.remove('hidden')});
</script></body></html>
